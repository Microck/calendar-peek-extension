<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar Peek</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <img src="../icons/icon48.png" width="30" height="30" alt="">
      <h1>View coworker calendar</h1>
    </div>

    <form id="person-form" novalidate>
      <label for="email">Coworker email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required autofocus>
      <p id="error" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v5.3a6.5 6.5 0 0 0-2-1.2V9H4v10a1 1 0 0 0 1 1h7.1c.3.7.7 1.4 1.2 2H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 11a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a1 1 0 0 0-1 1v3c0 .3.1.5.3.7l1.8 1.3a1 1 0 1 0 1.2-1.6L21 18.5V16a1 1 0 0 0-1-1Z"/>
        </svg>
        View calendar
      </button>
    </form>

    <p class="note">Shows only the availability or details Google has already shared with you.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
